<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Shell-owned screen: the "Set up sync" wizard, in its own window. Its script talks only to the typed
       preload surface (window.dockvault.wizard): it renders the question the main process is posing and hands
       back a choice. It fetches nothing, names no folder, and holds no state beyond what is on screen. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'">
  <title>DockVault — Set up sync</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0a0f18; color: #e6edf6;
      display: flex; flex-direction: column; box-sizing: border-box; min-height: 100%;
    }
    header { padding: 1.25rem 2rem 0; }
    .steps { display: flex; gap: .5rem; flex-wrap: wrap; margin: 0 0 .25rem; padding: 0; list-style: none; font-size: .85rem; color: #6f849f; }
    .steps li { display: flex; align-items: center; gap: .4rem; }
    .steps li::before { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: #2b3a52; }
    .steps li[data-state="current"] { color: #e6edf6; font-weight: 600; }
    .steps li[data-state="current"]::before { background: #4c8dff; }
    .steps li[data-state="done"] { color: #9be0b2; }
    .steps li[data-state="done"]::before { background: #3ecf7a; }
    main { flex: 1; padding: .75rem 2rem 1.5rem; overflow: auto; }
    h1 { font-size: 1.35rem; margin: .25rem 0 .5rem; }
    p { margin: 0 0 .9rem; color: #b9c4d4; }
    .lead { color: #e6edf6; }
    .box { margin: .75rem 0; padding: .85rem 1rem; border: 1px solid #22304a; border-radius: 10px; background: #0e1626; }
    .box.warn { border-color: #5a4a1e; background: #1a1708; }
    .box.warn p { color: #f0d9a3; }
    .box.bad { border-color: #6b2d27; background: #1b0f0e; }
    .box.bad p { color: #ffb4a8; }
    .box.ok { border-color: #1f4d33; background: #0c1a12; }
    .box.ok p { color: #9be0b2; }
    .box p:last-child { margin-bottom: 0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9rem; word-break: break-all; }
    label { display: block; font-weight: 600; margin-bottom: .35rem; }
    input[type="text"] {
      width: 100%; box-sizing: border-box; font: inherit; padding: .6rem .75rem;
      border: 1px solid #2b3a52; border-radius: 8px; background: #101a2c; color: #e6edf6;
    }
    input[type="text"]:focus { outline: 2px solid #4c8dff; outline-offset: 1px; }
    input[aria-invalid="true"] { border-color: #e0685c; }
    .hint { font-size: .9rem; color: #8aa0bd; margin: .4rem 0 0; }
    .vaults { list-style: none; margin: .5rem 0 0; padding: 0; display: grid; gap: .5rem; }
    .vaults li { margin: 0; }
    .vault {
      display: flex; gap: .75rem; align-items: center; width: 100%; box-sizing: border-box; text-align: left;
      font: inherit; color: #e6edf6; background: #101a2c; border: 1px solid #2b3a52; border-radius: 10px; padding: .7rem .9rem; cursor: pointer;
    }
    .vault:hover { border-color: #4c8dff; }
    .vault[aria-checked="true"] { border-color: #4c8dff; background: #142445; }
    .vault .name { font-weight: 600; flex: 1; }
    .badge { font-size: .78rem; color: #b9c4d4; border: 1px solid #2b3a52; border-radius: 999px; padding: .1rem .55rem; }
    ul.plain { margin: .25rem 0 .75rem 1.1rem; padding: 0; color: #b9c4d4; }
    footer { padding: 1rem 2rem 1.5rem; display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid #1a2538; }
    .btn {
      font: inherit; font-weight: 600; border: 1px solid #2b3a52; border-radius: 8px; padding: .55rem 1rem;
      color: #e6edf6; background: #14203a; cursor: pointer;
    }
    .btn.primary { background: #2f6fed; border-color: #2f6fed; }
    .btn.danger { background: #7a2e27; border-color: #7a2e27; }
    .btn:disabled { opacity: .55; cursor: default; }
    .spacer { flex: 1; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <ol class="steps" id="steps" aria-label="Steps">
      <li id="step-computer">This computer</li>
      <li id="step-vault">Vault</li>
      <li id="step-folder">Folder</li>
    </ol>
  </header>
  <main id="main" aria-live="polite">
    <h1 id="title">Getting things ready…</h1>
    <div id="body"></div>
  </main>
  <footer id="footer"></footer>
  <script src="sync-wizard.js"></script>
</body>
</html>

name: Build installers

# Produces the platform builds: a .dmg per architecture for macOS, TWO Windows .exe files — the
# NSIS installer and a portable build that runs without installing — and an AppImage plus .deb for
# Linux. Runs on demand (everything kept as workflow artifacts) and on
# version tags, where they are also attached to the GitHub release for that tag — the portable
# Windows build included, since a person choosing a download may want the one that installs nothing.
#
# Every leg starts the packaged app in its headless smoke mode before anything is uploaded.
#
# Signing is driven entirely by repository secrets. When they are absent the artifacts are
# produced UNSIGNED and the job summary says so; nothing in this workflow or the repository holds a
# certificate, password, or Apple credential. Unsigned installers reach a release only as a
# labelled preview (a vX.Y.Z-preview.N tag, published as a pre-release); see the release job.
#
#   Windows Authenticode : CSC_LINK (base64 .pfx), CSC_KEY_PASSWORD
#   macOS signing        : CSC_LINK (base64 .p12), CSC_KEY_PASSWORD
#   macOS notarization   : APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ONE date for every leg, read once, HERE. The three build legs are separate machines started at
  # slightly different moments, and a run crossing midnight UTC would otherwise ship Windows, macOS and
  # Linux installers of ONE commit claiming two different days. A job output is a single value the legs
  # consume; three reads of three clocks would only usually agree, and the day they did not is exactly
  # the day it would matter.
  #
  # This replaces `${{ github.run_started_at }}`, which is NOT a property of the `github` expression
  # context — it exists only in the REST API's payload for a run. It rendered as the empty string, the
  # date guard below refused, and all three legs failed. That is the trap worth naming: an expression
  # naming something the context does not have is not an error, it is "", so the fix is to take the
  # value from something that demonstrably WRITES it. There is no guard here; the one guard lives where
  # the value is USED, so that a date which fails to arrive is caught in the leg that would have
  # stamped it, however it came to be missing.
  build_date:
    name: Date this build
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.today.outputs.date }}
    steps:
      - name: Read the build date once, for all three legs
        id: today
        shell: bash
        run: |
          set -euo pipefail
          # Checked HERE as well as at the point of use, because `set -e` would not catch it: if the
          # clock read failed, `echo "date=$(date -u +%F)"` still exits 0 and this job would go GREEN
          # publishing an empty date. The legs would then refuse correctly — but only after three
          # runners had each spent a few minutes installing dependencies to find that out.
          built=$(date -u +%F)
          [ -n "$built" ] || { echo "::error::refusing to build: the clock could not be read"; exit 1; }
          echo "date=$built" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: build_date
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rclone: win32-x64
            eb: --win --x64
          - name: macOS
            os: macos-latest
            rclone: darwin-arm64 darwin-x64
            eb: --mac --arm64 --x64
          - name: Linux
            os: ubuntu-latest
            rclone: linux-x64
            eb: --linux --x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # WHICH build is this? Every artifact this workflow produces carries the commit it was built
      # from and the day it was built, so an installed app can name itself (an About box and the
      # Computers window footer show it) and a downloaded file can be matched to a commit. Written
      # to the environment here rather than inline on the build step, because both values have to be
      # shaped by a shell; electron-builder.js reads them and bakes them into the app's metadata.
      #
      # `github.sha` is the commit this job checked out, so the stamp can never name a different one.
      # The date is not read here at all: it is handed down from the `build_date` job above, so all
      # three legs stamp one value rather than each reading its own clock. See that job for why.
      - name: Stamp this build with its commit and date
        id: stamp
        shell: bash
        env:
          COMMIT: ${{ github.sha }}
          BUILT: ${{ needs.build_date.outputs.date }}
        run: |
          set -euo pipefail
          built="$BUILT"
          # Refuse to build rather than build something that cannot say what it is. Without this the
          # stamp would fail SILENTLY: electron-builder.js drops a malformed value, so an empty COMMIT
          # would ship installers that tell their owner they carry no commit, from a green pipeline run.
          # This is also what lets the app say a copy with no stamp did not come from here.
          # The pattern is anchored over the WHOLE value, which is what keeps a newline out of the
          # $GITHUB_ENV writes below (a newline there would define further variables of its own).
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::refusing to build: the commit to stamp is not a commit id"
            exit 1
          fi
          if [[ ! "$built" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::refusing to build: the build date is not a date"
            exit 1
          fi
          {
            echo "DOCKVAULT_BUILD_COMMIT=$COMMIT"
            echo "DOCKVAULT_BUILD_DATE=$built"
          } >> "$GITHUB_ENV"
          echo "short=${COMMIT:0:7}" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.name }}: build ${COMMIT:0:7} ($built)" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether this build can be signed
        id: signing
        shell: bash
        env:
          HAS_CERT: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          echo "cert=$HAS_CERT" >> "$GITHUB_OUTPUT"
          if [ "$HAS_CERT" != "true" ]; then
            echo "### ${{ matrix.name }}: UNSIGNED build (no signing certificate configured)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ runner.os }}" = "macOS" ] && [ "$HAS_NOTARY" != "true" ]; then
            echo "### ${{ matrix.name }}: signed but NOT notarized (no Apple credentials configured)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.name }}: signed build" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fetch and electron-builder run as SEPARATE steps, not chained with `&&` inside one npm
      # script: on the Windows runner npm ran the script string through cmd.exe and dropped the
      # command after `&&`, so electron-builder never started (mac/Linux, on bash, were fine).
      - name: Fetch the rclone binary
        shell: bash
        run: node scripts/fetch-rclone.js ${{ matrix.rclone }}

      - name: Build installers
        shell: bash
        env:
          # With no certificate, stop electron-builder from looking for one in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.cert }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Invoke electron-builder's node entry point directly rather than through `npx`. On the
        # Windows runner under git-bash, `npx electron-builder` exited 0 in under two seconds with
        # NO output and produced no dist/ — npx never actually ran the binary there (the macOS and
        # Linux legs, running the identical command, built normally). `node scripts/fetch-rclone.js`
        # runs fine in that same shell, so the node entry does too; this matches the working pattern
        # and removes npx from the path on every OS. The post-build check turns a silent no-output
        # build into a loud, correctly-attributed failure instead of a missing-file error two steps
        # later.
        run: |
          node node_modules/electron-builder/cli.js ${{ matrix.eb }} --publish never
          ls -la dist/ || { echo "::error::electron-builder produced no dist/ output"; exit 1; }

      # The stamp is only worth having if it is REALLY IN THERE. Everything above proves the values were
      # correct and exported; this proves they survived into the packaged app, which is a different claim
      # and the one that matters. Without it a lost export would still produce an installer named after a
      # commit whose own About box says it carries none — a file whose label and its contents disagree.
      #
      # What is checked is the COMMIT'S OWN CHARACTERS. The stamped package.json travels inside the app
      # archive as plain bytes, so this needs no unpacking and no tool, and the commit id is a string
      # nothing else in the archive contains — unlike the field NAME `buildCommit`, which is also in the
      # source of the module that reads it, and so is present in an unstamped build too. (It was: an
      # unstamped build was run against this step, and only the commit check told the two apart.)
      - name: Check the packaged app really carries the stamp
        shell: bash
        run: |
          set -euo pipefail
          # `grep -l` names the archives that contain the bytes; a zero match exits non-zero, hence the
          # `|| true`, which is why the counts are compared rather than trusted to abort on their own.
          total=$(find dist -name app.asar | wc -l | tr -d '[:space:]')
          named=$( (find dist -name app.asar -exec grep -lF "$DOCKVAULT_BUILD_COMMIT" {} + || true) | wc -l | tr -d '[:space:]')
          echo "app archives: $total, carrying this build's commit: $named"
          if [ "$total" -eq 0 ]; then
            echo "::error::no packaged app archive found, so the build stamp could not be checked"
            exit 1
          fi
          if [ "$named" -ne "$total" ]; then
            echo "::error::a packaged app was built without the build stamp; refusing to ship an installer that cannot say what it is"
            exit 1
          fi

      # Does the PACKAGED app start on this platform? Everything above proves an installer was produced;
      # nothing proved the app inside it runs -- and on this pipeline two platforms are never started by
      # hand. Each leg runs the app's own headless check (DOCKVAULT_SMOKE: the boot crypto self-test, the
      # UI loaded over the app scheme, the renderer's secure context) from what the installer carries,
      # and the result file plus the exit code must both say it passed. A crash, a refusal to launch
      # (an Apple-silicon binary with a broken signature is killed before it runs), or a hang all fail.
      - name: Smoke-test the packaged app
        shell: bash
        run: |
          set -euo pipefail
          run_smoke() {            # run_smoke <label> <command...>: the app, in smoke mode, SMOKE_LIMIT s at most
            local label="$1"; shift
            local result="$RUNNER_TEMP/smoke-$label.json" log="$RUNNER_TEMP/smoke-$label.log" code=0 pid
            local limit="${SMOKE_LIMIT:-120}"
            rm -f "$result"
            DOCKVAULT_SMOKE=1 DOCKVAULT_SMOKE_RESULT="$result" "$@" --user-data-dir="$RUNNER_TEMP/smoke-profile-$label" \
              > "$log" 2>&1 &
            pid=$!
            for _ in $(seq 1 "$limit"); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" 2>/dev/null || true
              echo "::error::$label: the packaged app did not finish its smoke check within $limit s"; tail -40 "$log"; return 1
            fi
            wait "$pid" || code=$?
            if [ "$code" -ne 0 ] || ! grep -q '"ok": true' "$result" 2>/dev/null; then
              echo "::error::$label: the packaged app failed its smoke check (exit $code)"
              cat "$result" 2>/dev/null || echo "(no result file)"; tail -40 "$log"; return 1
            fi
            echo "$label: smoke check passed"
            echo "- $label: the packaged app starts and passes its smoke check" >> "$GITHUB_STEP_SUMMARY"
          }
          case "${{ runner.os }}" in
            Windows)
              run_smoke windows-x64 dist/win-unpacked/DockVault.exe
              ;;
            macOS)
              # From the .dmg itself, since that is what a person downloads. Report the signature and
              # Gatekeeper's verdict as they are (an unsigned preview is expected to be refused by
              # Gatekeeper); the gate is that the app runs.
              for arch in arm64 x64; do
                dmg=$(find dist -maxdepth 1 -name "*-mac-$arch.dmg" | head -1)
                [ -n "$dmg" ] || { echo "::error::no $arch .dmg was produced"; exit 1; }
                mnt="$RUNNER_TEMP/dmg-$arch"; mkdir -p "$mnt" "$RUNNER_TEMP/app-$arch"
                hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
                cp -R "$mnt/DockVault.app" "$RUNNER_TEMP/app-$arch/"
                hdiutil detach "$mnt" >/dev/null
                app="$RUNNER_TEMP/app-$arch/DockVault.app"
                if codesign --verify --deep --strict "$app" 2>"$RUNNER_TEMP/codesign-$arch.txt"; then sig="valid"; else sig="INVALID: $(tr '\n' ' ' < "$RUNNER_TEMP/codesign-$arch.txt")"; fi
                kind=$(codesign -dv "$app" 2>&1 | grep -E '^(Signature|Authority|flags)' | tr '\n' ' ' || true)
                gk=$(spctl --assess --type execute "$app" 2>&1 | tr '\n' ' ' || true)
                echo "- macOS $arch: signature $sig; $kind; Gatekeeper: ${gk:-accepted}" >> "$GITHUB_STEP_SUMMARY"
                echo "macOS $arch: signature $sig | $kind | Gatekeeper: ${gk:-accepted}"
                if [ "$arch" = arm64 ]; then
                  run_smoke "macos-$arch" "$app/Contents/MacOS/DockVault"
                elif arch -x86_64 /usr/bin/true 2>/dev/null; then
                  # Under Rosetta. Its first launch translates the whole Electron framework before
                  # anything runs, which took longer than the native limit on the runner.
                  SMOKE_LIMIT=480 run_smoke "macos-$arch" arch -x86_64 "$app/Contents/MacOS/DockVault"
                else
                  echo "::notice::macOS x64: no Rosetta on this runner, so the Intel build was not started"
                fi
              done
              ;;
            Linux)
              timeout 300 sudo apt-get install -y --no-install-recommends xvfb >/dev/null
              # The .deb, installed the way a person installs it (its post-install step sets up the
              # Chromium sandbox helper), then the AppImage as downloaded.
              deb=$(find dist -maxdepth 1 -name '*.deb' | head -1)
              [ -n "$deb" ] || { echo "::error::no .deb was produced"; exit 1; }
              pkg=$(dpkg-deb -f "$deb" Package)
              timeout 300 sudo apt-get install -y "./$deb" >/dev/null
              # Launch what the desktop menu launches: the Exec line of the package's .desktop entry.
              entry=$(dpkg -L "$pkg" | grep -E '\.desktop$' | head -1 || true)
              [ -n "$entry" ] || { echo "::error::package $pkg installed no .desktop entry"; exit 1; }
              bin=$(sed -n 's/^Exec=//p' "$entry" | head -1 | sed -E 's/ %[a-zA-Z]//g; s/^"//; s/"$//')
              echo "package $pkg; menu entry $entry launches: $bin"
              [ -x "$bin" ] || { echo "::error::the menu entry's command is not an executable: $bin"; exit 1; }
              run_smoke linux-deb xvfb-run -a "$bin"
              appimage=$(find dist -maxdepth 1 -name '*.AppImage' | head -1)
              chmod +x "$appimage"
              run_smoke linux-appimage xvfb-run -a "./$appimage" --appimage-extract-and-run
              ;;
          esac

      # Each leg records whether its installers are signed, so the release job can refuse to publish
      # unsigned ones. Linux has no code signing in this pipeline, so its record is "not-applicable".
      - name: Record signing state
        shell: bash
        env:
          CERT: ${{ steps.signing.outputs.cert }}
          NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          case "${{ runner.os }}" in
            Windows) if [ "$CERT" = "true" ]; then state=signed; else state=unsigned; fi ;;
            macOS)   if [ "$CERT" = "true" ] && [ "$NOTARY" = "true" ]; then state=signed; else state=unsigned; fi ;;
            *)       state=not-applicable ;;
          esac
          echo "$state" > "dist/signing-${{ matrix.name }}.txt"
          echo "signing state: $state"

      - name: List artifacts
        shell: bash
        run: ls -l dist | grep -Ev "\.(yml|yaml|blockmap)$" || true

      # The Windows leg produces TWO .exe files and both are wanted: the installer, and the portable
      # build that runs without installing. `dist/*.exe` collects both — named separately by the build
      # config so neither can overwrite the other — and the check below refuses to upload a Windows
      # leg that somehow produced only one of them, since a silently missing portable build would look
      # exactly like a successful run.
      - name: Check both Windows artifacts exist
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          portable=$(find dist -maxdepth 1 -name '*-portable.exe' | wc -l | tr -d '[:space:]')
          installer=$(find dist -maxdepth 1 -name '*.exe' -not -name '*-portable.exe' | wc -l | tr -d '[:space:]')
          echo "installer: $installer, portable: $portable"
          if [ "$installer" -lt 1 ] || [ "$portable" -lt 1 ]; then
            echo "::error::the Windows leg must produce both an installer and a portable build"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dockvault-${{ matrix.name }}-${{ steps.stamp.outputs.short }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/signing-*.txt

  # On a version tag, attach every installer to the release for that tag (created as a draft if it
  # does not exist yet, so the notes can be written before it is published). This is the only job
  # that can write to the repository, and only on tags.
  #
  # A normal release needs every leg to report exactly "signed" or "not-applicable". An UNSIGNED build
  # is published only as a preview: the tag's version must say so (vX.Y.Z-preview.N), the release is a
  # GitHub pre-release titled "unsigned preview", and unsigned installers are never attached to an
  # existing release that is not a pre-release. Any other tag with unsigned installers is skipped, and
  # they stay workflow artifacts. Every installer must also carry the tag's own version in its name.
  release:
    name: Attach installers to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l installers
          records=0
          signed=true
          known=true
          for f in installers/signing-*.txt; do
            [ -e "$f" ] || continue
            records=$((records + 1))
            state=$(tr -d '[:space:]' < "$f")
            echo "$f: $state"
            case "$state" in
              signed|not-applicable) ;;
              unsigned) signed=false ;;
              *) known=false ;;
            esac
          done
          if [ "$records" -ne 3 ] || [ "$known" != "true" ]; then
            echo "::error::expected one signing record from each of the three legs, each signed, unsigned or not-applicable"
            exit 1
          fi
          # A tag may carry only its own version's installers.
          version="${TAG#v}"
          for f in installers/*.exe installers/*.dmg installers/*.AppImage installers/*.deb; do
            case "$(basename "$f")" in
              "DockVault-$version-"*) ;;
              *) echo "::error::$(basename "$f") is not a $version installer; refusing to attach it to $TAG"; exit 1 ;;
            esac
          done
          if [ "$signed" = "true" ]; then
            title="$TAG"
            flags=(--draft)
          else
            case "$TAG" in
              v*-preview*) ;;
              *)
                echo "::notice::Unsigned installers, and $TAG is not a preview tag; skipping release attach (the installers remain downloadable as workflow artifacts). A normal release needs the signing secrets; an unsigned build can be published only on a vX.Y.Z-preview.N tag."
                exit 0
                ;;
            esac
            title="DockVault Desktop $version (unsigned preview)"
            flags=(--draft --prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$signed" != "true" ] && [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != "true" ]; then
              echo "::error::release $TAG exists and is not a pre-release; refusing to attach unsigned installers to it"
              exit 1
            fi
          else
            gh release create "$TAG" "${flags[@]}" --title "$title" --notes ""
          fi
          gh release upload "$TAG" installers/*.exe installers/*.dmg installers/*.AppImage installers/*.deb --clobber

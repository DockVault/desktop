name: Build installers

# Produces the platform installers: a .dmg per architecture for macOS, an NSIS .exe for Windows,
# and an AppImage plus .deb for Linux. Runs on demand (installers kept as workflow artifacts) and on
# version tags, where the installers are also attached to the GitHub release for that tag.
#
# Signing is driven entirely by repository secrets. When they are absent the artifacts are
# produced UNSIGNED and the job summary says so; nothing in this workflow or the repository holds a
# certificate, password, or Apple credential.
#
#   Windows Authenticode : CSC_LINK (base64 .pfx), CSC_KEY_PASSWORD
#   macOS signing        : CSC_LINK (base64 .p12), CSC_KEY_PASSWORD
#   macOS notarization   : APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rclone: win32-x64
            eb: --win --x64
          - name: macOS
            os: macos-latest
            rclone: darwin-arm64 darwin-x64
            eb: --mac --arm64 --x64
          - name: Linux
            os: ubuntu-latest
            rclone: linux-x64
            eb: --linux --x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # WHICH build is this? Every artifact this workflow produces carries the commit it was built
      # from and the day it was built, so an installed app can name itself (an About box and the
      # Computers window footer show it) and a downloaded file can be matched to a commit. Written
      # to the environment here rather than inline on the build step, because both values have to be
      # shaped by a shell; electron-builder.js reads them and bakes them into the app's metadata.
      #
      # `github.sha` is the commit this job checked out, so the stamp can never name a different one.
      # The date comes from when the RUN started, not from each runner's own clock: the three legs are
      # separate machines started at slightly different moments, and a run crossing midnight UTC would
      # otherwise ship Windows, macOS and Linux installers of ONE commit claiming two different days.
      - name: Stamp this build with its commit and date
        id: stamp
        shell: bash
        env:
          COMMIT: ${{ github.sha }}
          STARTED: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          built=${STARTED:0:10}
          # Refuse to build rather than build something that cannot say what it is. Without this the
          # stamp would fail SILENTLY: electron-builder.js drops a malformed value, so an empty COMMIT
          # would ship installers that tell their owner they carry no commit, from a green pipeline run.
          # This is also what lets the app say a copy with no stamp did not come from here.
          # The pattern is anchored over the WHOLE value, which is what keeps a newline out of the
          # $GITHUB_ENV writes below (a newline there would define further variables of its own).
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::refusing to build: the commit to stamp is not a commit id"
            exit 1
          fi
          if [[ ! "$built" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::refusing to build: the build date is not a date"
            exit 1
          fi
          {
            echo "DOCKVAULT_BUILD_COMMIT=$COMMIT"
            echo "DOCKVAULT_BUILD_DATE=$built"
          } >> "$GITHUB_ENV"
          echo "short=${COMMIT:0:7}" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.name }}: build ${COMMIT:0:7} ($built)" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether this build can be signed
        id: signing
        shell: bash
        env:
          HAS_CERT: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          echo "cert=$HAS_CERT" >> "$GITHUB_OUTPUT"
          if [ "$HAS_CERT" != "true" ]; then
            echo "### ${{ matrix.name }}: UNSIGNED build (no signing certificate configured)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ runner.os }}" = "macOS" ] && [ "$HAS_NOTARY" != "true" ]; then
            echo "### ${{ matrix.name }}: signed but NOT notarized (no Apple credentials configured)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.name }}: signed build" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fetch and electron-builder run as SEPARATE steps, not chained with `&&` inside one npm
      # script: on the Windows runner npm ran the script string through cmd.exe and dropped the
      # command after `&&`, so electron-builder never started (mac/Linux, on bash, were fine).
      - name: Fetch the rclone binary
        shell: bash
        run: node scripts/fetch-rclone.js ${{ matrix.rclone }}

      - name: Build installers
        shell: bash
        env:
          # With no certificate, stop electron-builder from looking for one in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.cert }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Invoke electron-builder's node entry point directly rather than through `npx`. On the
        # Windows runner under git-bash, `npx electron-builder` exited 0 in under two seconds with
        # NO output and produced no dist/ — npx never actually ran the binary there (the macOS and
        # Linux legs, running the identical command, built normally). `node scripts/fetch-rclone.js`
        # runs fine in that same shell, so the node entry does too; this matches the working pattern
        # and removes npx from the path on every OS. The post-build check turns a silent no-output
        # build into a loud, correctly-attributed failure instead of a missing-file error two steps
        # later.
        run: |
          node node_modules/electron-builder/cli.js ${{ matrix.eb }} --publish never
          ls -la dist/ || { echo "::error::electron-builder produced no dist/ output"; exit 1; }

      # The stamp is only worth having if it is REALLY IN THERE. Everything above proves the values were
      # correct and exported; this proves they survived into the packaged app, which is a different claim
      # and the one that matters. Without it a lost export would still produce an installer named after a
      # commit whose own About box says it carries none — a file whose label and its contents disagree.
      #
      # What is checked is the COMMIT'S OWN CHARACTERS. The stamped package.json travels inside the app
      # archive as plain bytes, so this needs no unpacking and no tool, and the commit id is a string
      # nothing else in the archive contains — unlike the field NAME `buildCommit`, which is also in the
      # source of the module that reads it, and so is present in an unstamped build too. (It was: an
      # unstamped build was run against this step, and only the commit check told the two apart.)
      - name: Check the packaged app really carries the stamp
        shell: bash
        run: |
          set -euo pipefail
          # `grep -l` names the archives that contain the bytes; a zero match exits non-zero, hence the
          # `|| true`, which is why the counts are compared rather than trusted to abort on their own.
          total=$(find dist -name app.asar | wc -l | tr -d '[:space:]')
          named=$( (find dist -name app.asar -exec grep -lF "$DOCKVAULT_BUILD_COMMIT" {} + || true) | wc -l | tr -d '[:space:]')
          echo "app archives: $total, carrying this build's commit: $named"
          if [ "$total" -eq 0 ]; then
            echo "::error::no packaged app archive found, so the build stamp could not be checked"
            exit 1
          fi
          if [ "$named" -ne "$total" ]; then
            echo "::error::a packaged app was built without the build stamp; refusing to ship an installer that cannot say what it is"
            exit 1
          fi

      # Each leg records whether its installers are signed, so the release job can refuse to publish
      # unsigned ones. Linux has no code signing in this pipeline, so its record is "not-applicable".
      - name: Record signing state
        shell: bash
        env:
          CERT: ${{ steps.signing.outputs.cert }}
          NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          case "${{ runner.os }}" in
            Windows) if [ "$CERT" = "true" ]; then state=signed; else state=unsigned; fi ;;
            macOS)   if [ "$CERT" = "true" ] && [ "$NOTARY" = "true" ]; then state=signed; else state=unsigned; fi ;;
            *)       state=not-applicable ;;
          esac
          echo "$state" > "dist/signing-${{ matrix.name }}.txt"
          echo "signing state: $state"

      - name: List artifacts
        shell: bash
        run: ls -l dist | grep -Ev "\.(yml|yaml|blockmap)$" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dockvault-${{ matrix.name }}-${{ steps.stamp.outputs.short }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/signing-*.txt

  # On a version tag, attach every installer to the release for that tag (created as a draft if it
  # does not exist yet, so the notes can be written before it is published). This is the only job
  # that can write to the repository, and only on tags. It publishes only when every one of the three
  # legs reports exactly "signed" or "not-applicable" (an allowlist, so an unexpected or empty record
  # also refuses): an unsigned installer is for local testing, never for a release.
  release:
    name: Attach installers to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l installers
          publish=true
          records=0
          for f in installers/signing-*.txt; do
            [ -e "$f" ] || continue
            records=$((records + 1))
            state=$(tr -d '[:space:]' < "$f")
            echo "$f: $state"
            case "$state" in
              signed|not-applicable) ;;
              *) publish=false ;;
            esac
          done
          if [ "$records" -ne 3 ]; then
            publish=false
          fi
          if [ "$publish" != "true" ]; then
            echo "::notice::Unsigned or incomplete installers; skipping release attach (the installers remain downloadable as workflow artifacts). Configure the signing secrets to publish a release."
            exit 0
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes ""
          gh release upload "$TAG" installers/*.exe installers/*.dmg installers/*.AppImage installers/*.deb --clobber
